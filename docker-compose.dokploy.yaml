services:
  connection-machine:
    build:
      context: .
    env_file:
      - .env
    environment:
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: ${METRICS_HOST:-0.0.0.0}
      METRICS_PORT: ${METRICS_PORT:-9102}
    restart: always
    dns:
      - 1.1.1.1
    expose:
      - "${METRICS_PORT:-9102}"
    networks:
      default: {}
      connection-machine-metrics:
        aliases:
          - connection-machine-metrics
    logging:
      driver: json-file
      options:
        max-size: 500m
        max-file: "3"
    volumes:
      - connection-machine-data:/app/data
volumes:
  connection-machine-data:
    external: true
    name: connection-machine-data
networks:
  connection-machine-metrics:
    external: true
    name: connection-machine-metrics
  dokploy-network:
    external: true
